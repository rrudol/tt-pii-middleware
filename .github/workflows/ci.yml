name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          make install
      - name: Unit & API tests
        run: make test
      - name: Public eval gates (3000 docs)
        run: make eval-public
