[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tt-pii-middleware"
version = "0.1.0"
description = "Thinking Typewriters PII detection & redaction middleware (Polish + universal identifiers)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Thinking Typewriters" }]
keywords = ["pii", "privacy", "presidio", "poland", "redaction"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
]
license = { text = "Apache-2.0" }
dependencies = [
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "pii-presidio==0.1.0",
    "pii-core==0.1.0",
    "pii-veil==0.1.0",
    "spacy==3.8.16",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic-settings==2.15.0",
    "redis==8.1.0",
]

[project.urls]
Homepage = "https://github.com/rrudol/tt-pii-middleware"
Repository = "https://github.com/rrudol/tt-pii-middleware"
Dataset = "https://huggingface.co/datasets/rafalrudol/pl-pii-synthetic-v1"
Metrics = "https://huggingface.co/spaces/rafalrudol/pl-pii-metrics"
Demo = "https://huggingface.co/spaces/rafalrudol/pl-pii-redact-demo"
Issues = "https://github.com/rrudol/tt-pii-middleware/issues"

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
