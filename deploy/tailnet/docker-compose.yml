# Tailnet-only PL-PII redact demo.
# Binds exclusively to the host Tailscale IP — not reachable from the public internet.
services:
  pl-pii-demo:
    build:
      context: ../..
      dockerfile: spaces/demo/Dockerfile.local
    image: pl-pii-demo:tailnet
    container_name: pl-pii-demo
    restart: unless-stopped
    environment:
      SPACY_MODEL: pl_core_news_sm
      SPACY_MODEL_EN: en_core_web_sm
      DEFAULT_LANGUAGE: pl
      MAX_TEXT_LENGTH: "2000"
      ENABLE_KRS: "true"
      DEMO_RATE_LIMIT: "30"
      DEMO_RATE_WINDOW_SEC: "60"
      LOG_LEVEL: INFO
      PORT: "7860"
    # Only Tailscale interface — never 0.0.0.0
    ports:
      - "${TAILSCALE_IP}:7860:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
